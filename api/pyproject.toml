[project]
name = "antang-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18,<2",
    "anyio>=4,<5",
    "fastapi>=0.139.0",
    "hindsight-client==0.8.4",
    "httpx>=0.28.1,<1",
    "langchain>=1.3,<2",
    "langchain-anthropic>=1,<2",
    "langchain-openai>=1.1,<2",
    "langgraph>=1.2,<2",
    "langgraph-checkpoint-postgres>=3.1,<4",
    "loguru>=0.7,<1",
    "numpy>=2.1,<3",
    "openai>=2.45.0",
    "psycopg[binary]>=3.2,<4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pypdf>=6,<7",
    "pyjwt>=2.10,<3",
    "python-multipart>=0.0.22,<1",
    "python-dotenv>=1.1.1",
    "sqlalchemy>=2.0,<2.1",
    "tavily-python>=0.7.26,<0.8",
    "uvicorn[standard]>=0.51.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/antang_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.15.21",
]
